name: Báo lỗi
description: Báo hành vi sai có thể tái hiện
title: "[Lỗi] "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Hiện tượng
      description: Điều gì đã xảy ra và bạn mong đợi điều gì?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Cách tái hiện
      description: Không dán token, mật khẩu hoặc dữ liệu khách.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Màn hình
      options: [Khách, Nhân viên, Chủ salon, Firebase, Zalo Mini App]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Thiết bị và trình duyệt/Zalo
