name: Lighthouse

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # Public, non-production Firebase fixture used only to build the audited bundle.
      VITE_FIREBASE_API_KEY: "ci-public-api-key"
      VITE_FIREBASE_AUTH_DOMAIN: "haircut-ci.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "haircut-ci"
      VITE_FIREBASE_STORAGE_BUCKET: "haircut-ci.appspot.com"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "100000000000"
      VITE_FIREBASE_APP_ID: "1:100000000000:web:ci"
      VITE_ZALO_MINI_APP_ID: "2038116772828167300"
      VITE_APP_ENV: production
      VITE_FUNCTION_WRITE_MODE: required
      VITE_MONITORING_DISABLED: "true"
    defaults:
      run:
        working-directory: zalo-mini-app

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zalo-mini-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit with Lighthouse
        run: npm run test:lighthouse
