name: Manager Native

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/manager-native.yml"
      - "apps/manager-mobile/**"
      - "test/manager-native-readiness.test.mjs"

permissions:
  contents: read

concurrency:
  group: manager-native-${{ github.ref }}
  cancel-in-progress: true

# Compile checks only: no Firebase project configuration, signing or upload.
jobs:
  android:
    name: Manager Android Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/manager-mobile/package-lock.json
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies and sync Android
        working-directory: apps/manager-mobile
        run: |
          npm ci
          npm run build
          npm exec --no -- cap sync android
      - name: Test, lint and assemble debug APK
        working-directory: apps/manager-mobile/android
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

  ios:
    name: Manager iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/manager-mobile/package-lock.json
      - name: Install dependencies and sync iOS
        working-directory: apps/manager-mobile
        run: |
          xcodebuild -version
          npm ci
          npm run build
          npm exec --no -- cap sync ios
      - name: Build simulator without signing
        working-directory: apps/manager-mobile
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
