# An isolated examination of native packages and policy evidence.
# This is a trial only: no secrets, publishing, Firebase deployment, or code updates.
name: CH Hair Complete Audit (trial)

on:
  pull_request:
    paths:
      - .github/workflows/ch-hair-complete-audit-trial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-dependencies:
    name: Policy and dependency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Retrieve pinned external playbook
        shell: bash
        run: |
          git clone --quiet https://github.com/mjmirza/app-store-compliance.git "${RUNNER_TEMP}/playbook"
          git -C "${RUNNER_TEMP}/playbook" checkout --quiet --detach 54c2e33254448a545fa2bcb25b3adfef984cf9dc
          test "$(git -C "${RUNNER_TEMP}/playbook" rev-parse HEAD)" = 54c2e33254448a545fa2bcb25b3adfef984cf9dc
      - name: Run native policy and privacy manifest validators
        shell: bash
        run: |
          mkdir -p audit-output
          set +e
          python3 "${RUNNER_TEMP}/playbook/scripts/release-audit.py" apps/manager-mobile > audit-output/release-audit.txt 2>&1
          echo "RELEASE_AUDIT_EXIT_CODE=$?" | tee -a audit-output/status.txt
          python3 "${RUNNER_TEMP}/playbook/scripts/validate-privacy-manifest.py" apps/manager-mobile/ios/App/App/PrivacyInfo.xcprivacy > audit-output/privacy-manifest.txt 2>&1
          echo "PRIVACY_MANIFEST_EXIT_CODE=$?" | tee -a audit-output/status.txt
          python3 "${RUNNER_TEMP}/playbook/scripts/accessibility-audit.py" apps/manager-mobile > audit-output/accessibility.txt 2>&1
          echo "ACCESSIBILITY_EXIT_CODE=$?" | tee -a audit-output/status.txt
          set -e
          cat audit-output/status.txt
          {
            echo "## Native store audit (informational)"
            echo ""
            echo "This is an independent audit, NOT proof that store reviewer accounts, legal disclosures, device behavior or Play/App Store listings are ready."
            echo ""
            echo '```'
            cat audit-output/status.txt
            echo '```'
            echo ""
            echo "Open job artifact for the complete findings, including false positives."
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Audit published dependency locks without changing them
        shell: bash
        run: |
          set +e
          for workspace in customer-web firebase/functions apps/admin-web apps/manager-mobile; do
            key="${workspace//\//-}"
            echo "Auditing ${workspace}"
            (cd "${workspace}" && npm audit --package-lock-only --omit=dev --audit-level=high --json) > "audit-output/dependencies-${key}.json" 2>&1
            echo "${key} npm-audit-exit=$?" | tee -a audit-output/status.txt
          done
          set -e
      - name: Upload scan outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-audit-policy-and-deps
          path: audit-output
          if-no-files-found: warn
          retention-days: 14

  android-native-build:
    name: Android native compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/manager-mobile/package-lock.json
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install and compile Capacitor frontend, generate Android assets
        working-directory: apps/manager-mobile
        run: |
          npm ci
          npm run check
          npx cap sync android
      - name: Compile Android debug, run Gradle unit tests and lint
        working-directory: apps/manager-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Android native audit"
            echo "No Google Play upload, no release signing, no Firebase production credentials."
            echo "Check steps above for any native compilation/test failures."
          } >> "${GITHUB_STEP_SUMMARY}"

  ios-simulator-build:
    name: iOS Simulator native compile
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/manager-mobile/package-lock.json
      - name: Display Xcode version
        run: xcodebuild -version
      - name: Compile frontend and synchronize iOS plugins
        working-directory: apps/manager-mobile
        run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Build unsigned iOS Simulator app
        working-directory: apps/manager-mobile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## iOS native audit"
            echo "Unsigned simulator build only; does not prove signing, archive, TestFlight, App Store review or iPhone device functions."
          } >> "${GITHUB_STEP_SUMMARY}"
