name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zalo-mini-app:
    name: Zalo Mini App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zalo-mini-app/package-lock.json

      - name: Install dependencies
        working-directory: zalo-mini-app
        run: npm ci

      - name: Build
        working-directory: zalo-mini-app
        run: npm run build

  firebase-functions:
    name: Firebase Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Build
        working-directory: firebase/functions
        run: npm run build

