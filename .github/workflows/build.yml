name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firebase-functions:
    name: Firebase Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Check Functions source
        working-directory: firebase/functions
        run: npm run check

      - name: Build
        working-directory: firebase/functions
        run: npm run build

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Test Firestore and Storage rules
        working-directory: firebase
        run: npx --yes firebase-tools@15.22.3 emulators:exec --project demo-haircut --only firestore,storage "npm --prefix functions run test:rules:emulator"

      - name: Test callable transactions
        working-directory: firebase
        run: npx --yes firebase-tools@15.22.3 emulators:exec --project demo-haircut --only firestore,storage "npm --prefix functions run test:integration:emulator"

  zalo-mini-app:
    name: Zalo Mini App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zalo-mini-app/package-lock.json

      - name: Install dependencies
        working-directory: zalo-mini-app
        run: npm ci

      - name: Lint
        working-directory: zalo-mini-app
        run: npm run lint

      - name: Check formatting
        working-directory: zalo-mini-app
        run: npm run format:check

      - name: Unit tests
        working-directory: zalo-mini-app
        run: npm run test:run

      - name: Build and validate Zalo package
        working-directory: zalo-mini-app
        env:
          # Public, non-production Firebase fixture used only to validate the CI bundle.
          VITE_FIREBASE_API_KEY: "ci-public-api-key"
          VITE_FIREBASE_AUTH_DOMAIN: "haircut-ci.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "haircut-ci"
          VITE_FIREBASE_STORAGE_BUCKET: "haircut-ci.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "100000000000"
          VITE_FIREBASE_APP_ID: "1:100000000000:web:ci"
          VITE_ZALO_MINI_APP_ID: "2038116772828167300"
          VITE_APP_ENV: production
          VITE_FUNCTION_WRITE_MODE: required
          VITE_MONITORING_DISABLED: "true"
        run: npm run build:zmp

      - name: Check Zalo review readiness
        working-directory: zalo-mini-app
        env:
          VITE_ZALO_MINI_APP_ID: "2038116772828167300"
          VITE_APP_ENV: production
        run: npm run check:zalo-review

  admin-web:
    name: Admin Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin-web
        run: npm ci

      - name: Typecheck, lint, unit test and build
        working-directory: apps/admin-web
        run: npm run check

  manager-mobile:
    name: Manager Mobile Web Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/manager-mobile/package-lock.json

      - name: Install Manager dependencies
        working-directory: apps/manager-mobile
        run: npm ci

      - name: Typecheck, unit test and build
        working-directory: apps/manager-mobile
        run: npm run check

  manager-android:
    name: Manager Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/manager-mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Manager dependencies
        working-directory: apps/manager-mobile
        run: npm ci

      - name: Build web and sync Android
        working-directory: apps/manager-mobile
        run: npm run build && npx cap sync android

      - name: Test, lint and assemble Android debug
        working-directory: apps/manager-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

  manager-ios:
    name: Manager iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/manager-mobile/package-lock.json

      - name: Install Manager dependencies
        working-directory: apps/manager-mobile
        run: npm ci

      - name: Build web and sync iOS
        working-directory: apps/manager-mobile
        run: npm run build && npx cap sync ios

      - name: Build iOS Simulator without signing
        working-directory: apps/manager-mobile
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  browser-tests:
    name: Browser flows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zalo-mini-app/package-lock.json

      - name: Install dependencies
        working-directory: zalo-mini-app
        run: npm ci

      - name: Install browser engines
        working-directory: zalo-mini-app
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        working-directory: zalo-mini-app
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: zalo-mini-app/playwright-report
          retention-days: 7

  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Ensure hosting build output is not committed
        shell: bash
        run: |
          if git ls-files firebase/public | grep -q .; then
            echo "firebase/public is generated by scripts/deploy-firebase.ps1 and must not be committed."
            git ls-files firebase/public
            exit 1
          fi

      - name: Ensure native credentials are not committed
        shell: bash
        run: |
          forbidden=(
            "apps/manager-mobile/android/app/google-services.json"
            "apps/manager-mobile/ios/App/App/GoogleService-Info.plist"
          )
          for path in "${forbidden[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "Native credential must not be committed: $path"
              exit 1
            fi
          done
          if git ls-files | grep -E '\.(jks|keystore|p8|p12|mobileprovision)$' >/dev/null; then
            echo "Signing credential is committed. Remove it before continuing."
            exit 1
          fi

      - name: Scan tracked files for secrets
        run: node scripts/check-secrets.mjs

      - name: Verify CSP source synchronization
        run: node scripts/sync-csp.mjs --check
