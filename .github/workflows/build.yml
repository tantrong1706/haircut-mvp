name: Kiểm tra build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zalo-mini-app:
    name: Ứng dụng Zalo
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zalo-mini-app/package-lock.json

      - name: Cài thư viện
        working-directory: zalo-mini-app
        run: npm ci

      - name: Biên dịch
        working-directory: zalo-mini-app
        run: npm run build

  firebase-functions:
    name: Firebase Functions
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Cài thư viện
        working-directory: firebase/functions
        run: npm ci

      - name: Biên dịch
        working-directory: firebase/functions
        run: npm run build
