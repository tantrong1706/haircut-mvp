name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firebase-functions:
    name: Firebase Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Check Functions source
        working-directory: firebase/functions
        run: npm run check

      - name: Build
        working-directory: firebase/functions
        run: npm run build

      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Test Firestore and Storage rules
        working-directory: firebase
        run: npx --yes firebase-tools@15.22.3 emulators:exec --project demo-haircut --only firestore,storage "npm --prefix functions run test:rules"

  zalo-mini-app:
    name: Zalo Mini App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zalo-mini-app/package-lock.json

      - name: Install dependencies
        working-directory: zalo-mini-app
        run: npm ci

      - name: Lint
        working-directory: zalo-mini-app
        run: npm run lint

      - name: Check formatting
        working-directory: zalo-mini-app
        run: npm run format:check

      - name: Unit tests
        working-directory: zalo-mini-app
        run: npm run test:run

      - name: Build and validate Zalo package
        working-directory: zalo-mini-app
        run: npm run build:zmp

      - name: Ensure Zalo config is current
        working-directory: zalo-mini-app
        run: git diff --exit-code -- app-config.json

  browser-tests:
    name: Browser flows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zalo-mini-app/package-lock.json

      - name: Install dependencies
        working-directory: zalo-mini-app
        run: npm ci

      - name: Install Chromium
        working-directory: zalo-mini-app
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: zalo-mini-app
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: zalo-mini-app/playwright-report
          retention-days: 7

  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure hosting build output is not committed
        shell: bash
        run: |
          if git ls-files firebase/public | grep -q .; then
            echo "firebase/public is generated by scripts/deploy-firebase.ps1 and must not be committed."
            git ls-files firebase/public
            exit 1
          fi
