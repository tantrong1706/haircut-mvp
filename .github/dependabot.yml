version: 2

updates:
  - package-ecosystem: npm
    directory: /customer-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      frontend-minor-patches:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /firebase/functions
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      backend-minor-patches:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/admin-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      admin-minor-patches:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/manager-mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      manager-web-minor-patches:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
        exclude-patterns:
          - "@aparajita/*"
          - "@capacitor/*"
          - "@capacitor-firebase/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      actions-minor-patches:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
